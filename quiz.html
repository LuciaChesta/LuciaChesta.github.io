<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Lucia Quiz</title>
<link rel="stylesheet" href="css/style.css">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: #eeeeee; /* puedes cambiar el color de fondo aquí */
    font-family: 'Open Sans', sans-serif;
  }

  .quiz-box {
    background: rgba(255,255,255,0.85);
    padding: 30px;
    border-radius: 15px;
    width: 500px;
    max-width: 90%;
    text-align: center;
    position: relative;
    box-shadow: 0 8px 20px rgba(0,0,0,0.2);
  }

  .timer {
    position: absolute;
    top: 10px;
    right: 15px;
    font-size: 18px;
  }

  h2#question {
    margin-bottom: 25px;
  }

  .answers {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
    margin-top: 20px;
  }

  .answers button {
    padding: 12px;
    border-radius: 10px;
    border: none;
    background: #666;
    color: white;
    cursor: pointer;
    font-size: 16px;
    transition: all 0.3s;
  }

  .answers button:hover {
    background: #444;
  }
</style>
</head>

<body>

<div class="quiz-box">
  <div class="timer">⏳ <span id="time">10</span></div>
  <h2 id="question">Question 1</h2>

  <div class="answers">
    <button></button>
    <button></button>
    <button></button>
    <button></button>
  </div>
</div>

<script src="quiz.js"></script>
</body>
</html>
