<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lucia Quiz</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Tipografía -->
  <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,600,700" rel="stylesheet">
  <style>
    body {
      font-family: 'Open Sans', sans-serif;
      background: #f2f2f2;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .quiz-box {
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0px 0px 20px rgba(0,0,0,0.2);
      max-width: 600px;
      width: 90%;
      text-align: center;
    }

    #question {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 20px;
    }

    .answers {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .answers button {
      padding: 12px;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      background: #666;
      color: white;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .answers button:hover {
      background: #444;
    }

    #time {
      font-weight: bold;
    }

    @media only screen and (max-width: 480px) {
      #question {
        font-size: 18px;
      }
      .answers button {
        font-size: 14px;
      }
    }
  </style>
</head>
<body>

  <div class="quiz-box">
    <h2 id="question">Question goes here</h2>
    <div class="answers">
      <button></button>
      <button></button>
      <button></button>
      <button></button>
    </div>
    <p>Time left: <span id="time">10</span> seconds</p>
  </div>

  <!-- Tu quiz.js -->
  <script src="quiz.js"></script>
</body>
</html>
