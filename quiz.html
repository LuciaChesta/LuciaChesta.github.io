<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lucia Quiz</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: url("images/FKt251206-20260104-RV_FalkorToo_Aerial_SunSet_Atlantic-VallejoPrut-0538.JPG") no-repeat center center;
            background-size: cover; /* hace que la imagen cubra toda la pantalla */
            font-family: Arial, sans-serif;
            margin: 0;
        }

        .quiz-box {
            background: rgba(255,255,255,0.95);
            padding: 30px;
            border-radius: 15px;
            width: 500px;
            text-align: center;
            position: relative;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        .timer, .score {
            position: absolute;
            font-size: 18px;
            font-weight: bold;
        }

        .timer {
            top: 10px;
            right: 15px;
        }

        .score {
            top: 10px;
            left: 15px;
        }

        .answers {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        .answers button {
            padding: 12px;
            border-radius: 10px;
            border: none;
            background: #666;
            color: white;
            cursor: pointer;
            font-size: 14px;
            transition: 0.3s;
        }

        .answers button:hover {
            background: #444;
        }

        /* Pantalla de inicio */
        #start-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #start-screen button {
            padding: 15px 30px;
            font-size: 18px;
            border: none;
            border-radius: 12px;
            background: #28a745;
            color: white;
            cursor: pointer;
            transition: 0.3s;
        }

        #start-screen button:hover {
            background: #218838;
        }
    </style>
</head>
<body>
    <div class="quiz-box">
        <!-- Pantalla de inicio -->
        <div id="start-screen">
            <h2>Welcome to Lucia's Quiz! 🎉</h2>
            <button id="start-btn">Start Quiz</button>
        </div>

        <!-- Contenido del quiz -->
        <div id="quiz-content" style="display:none;">
            <div class="score">Score: <span id="score">0</span></div>
            <div class="timer">⏳ <span id="time">20</span></div>
            <h2 id="question"></h2>
            <div class="answers">
                <button></button>
                <button></button>
                <button></button>
                <button></button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            let questions = [
                { text: "Where did Lucia study Oceanography?", answers: ["Stanford University","Fudan University","University of Buenos Aires","National University of the South"], correct: 2 },
                { text: "What does Lucia like to do in her free time?", answers: ["Read","Do sports","Learn about new things","All options are correct"], correct: 3 },
                { text: "What best describes Lucia’s professional profile?", answers: ["She enjoys working on challenging tasks that push her to grow every day.","She is interested in fashion design","She prefers working alone and avoids challenges","She wants to work only in offices"], correct: 0 },
                { text: "Where has Lucia gained field experience?", answers: ["In laboratories and classrooms","In an Antarctic research campaign","On an oceanographic cruise","All options are correct"], correct: 3 },
                { text: "Which option best describes Lucia’s strengths and weaknesses?", answers: ["She is lazy but very confident.","She is highly motivated and curious, but sometimes feels overwhelmed.","She avoids challenges and prefers easy tasks.","She is disorganized and not interested in learning."], correct: 1 }
            ];

            let currentQuestion = 0;
            let timeLeft = 20;
            let timer;
            let score = 0;
            let correctCount = 0;

            const startBtn = document.getElementById("start-btn");
            const startScreen = document.getElementById("start-screen");
            const quizContent = document.getElementById("quiz-content");
            const scoreDisplay = document.getElementById("score");
            const timeDisplay = document.getElementById("time");
            const questionEl = document.getElementById("question");
            const buttons = document.querySelectorAll(".answers button");

            // Función para iniciar el quiz
            startBtn.onclick = () => {
                startScreen.style.display = "none";
                quizContent.style.display = "block";
                loadQuestion();
            };

            function loadQuestion() {
                let q = questions[currentQuestion];
                questionEl.innerText = q.text;
                buttons.forEach((btn,index) => {
                    btn.innerText = q.answers[index];
                    btn.style.background = "#666";
                    btn.disabled = false;
                    btn.onclick = () => checkAnswer(index);
                });
                timeLeft = 20;
                timeDisplay.innerText = timeLeft;
                scoreDisplay.innerText = score;
                clearInterval(timer);
                timer = setInterval(countdown, 1000);
            }

            function countdown() {
                timeLeft--;
                timeDisplay.innerText = timeLeft;
                if(timeLeft <= 0) nextQuestion();
            }

            function checkAnswer(selected){
                clearInterval(timer);
                let q = questions[currentQuestion];
                buttons.forEach((btn,index)=>{
                    btn.disabled = true;
                    if(index === q.correct) btn.style.background = "green";
                    if(index === selected && index !== q.correct) btn.style.background = "red";
                });
                if(selected === q.correct){
                    score += 20;
                    correctCount++;
                }
                scoreDisplay.innerText = score;
                setTimeout(nextQuestion,1000);
            }

            function nextQuestion(){
                currentQuestion++;
                if(currentQuestion < questions.length) loadQuestion();
                else{
                    quizContent.innerHTML = `
                        <h2>Quiz finished 🎉</h2>
                        <p>Correct answers: ${correctCount} / ${questions.length}</p>
                        <p>Final Score: ${score} / 100</p>
                    `;
                }
            }
        });
    </script>
</body>
</html>
