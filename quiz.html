<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lucia Quiz</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: url("images/FKt251206-20260104-RV_FalkorToo_Aerial_SunSet_Atlantic-VallejoPrut-0538.JPG") no-repeat center center;
            background-size: cover;
            font-family: Arial, sans-serif;
            margin: 0;
        }

        .quiz-box {
            background: rgba(255,255,255,0.85);
            padding: 30px;
            border-radius: 15px;
            width: 500px;
            text-align: center;
            position: relative;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        .timer, .score {
            position: absolute;
            font-size: 18px;
            font-weight: bold;
        }

        .timer {
            top: 10px;
            right: 15px;
        }

        .score {
            top: 10px;
            left: 15px;
        }

        .answers {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        .answers button {
            padding: 12px;
            border-radius: 10px;
            border: none;
            background: #4a90e2;
            color: white;
            cursor: pointer;
            font-size: 14px;
            transition: 0.3s;
        }

        .answers button:hover {
            background: #357ABD;
        }

        /* Pantalla de inicio */
        #start-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #start-screen button {
            padding: 15px 30px;
            font-size: 18px;
            border: none;
            border-radius: 12px;
            background: #28a745;
            color: white;
            cursor: pointer;
            transition: 0.3s;
        }

        #start-screen button:hover {
            background: #218838;
        }

        /* Botón de reinicio */
        #restart-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            padding: 8px 12px;
            font-size: 14px;
            border: none;
            border-radius: 10px;
            background: #dc3545;
            color: white;
            cursor: pointer;
            display: none; /* solo se muestra al final */
        }

        #restart-btn:hover {
            background: #c82333;
        }

        /* Botón circular de reinicio al final */
        #final-restart-btn {
            display: none;
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            font-size: 24px;
            background: #28a745;
            color: white;
            border: none;
            cursor: pointer;
        }

        #final-restart-btn:hover {
            background: #218838;
        }
    </style>
</head>
<body>
    <div class="quiz-box">
        <!-- Botón de reinicio superior -->
        <button id="restart-btn">Restart</button>

        <!-- Pantalla de inicio -->
        <div id="start-screen">
            <h2>Welcome to Lucia's Quiz! 🎉</h2>
            <button id="start-btn">Take the Quiz</button>
        </div>

        <!-- Contenido del quiz -->
        <div id="quiz-content" style="display:none;">
            <div class="score">Score: <span id="score">0</span></div>
            <div class="timer">⏳ <span id="time">20</span></div>
            <h2 id="question"></h2>
            <div class="answers">
                <button></button>
                <button></button>
                <button></button>
                <button></button>
            </div>
        </div>

        <!-- Botón circular de reinicio al final -->
        <button id="final-restart-btn">↻</button>
    </div>

    <script src="quiz.js"></script>
</body>
</html>
